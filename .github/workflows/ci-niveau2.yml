name: CI/CD - Niveau 2 (Intermédiaire)

on:
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Vérifier la présence des fichiers requis
        run: |
          echo "Vérification des fichiers..."
          test -f index.html || (echo "Erreur: index.html manquant" && exit 1)
          test -f nginx.conf || (echo "Erreur: nginx.conf manquant" && exit 1)
          test -f Dockerfile || (echo "Erreur: Dockerfile manquant" && exit 1)
          test -f docker-compose.yml || (echo "Erreur: docker-compose.yml manquant" && exit 1)
          echo "Tous les fichiers requis sont présents !"

      - name: Build de l'image Docker
        run: docker build -t nginx-tp-niveau2 .

      - name: Démarrer le service avec Docker Compose
        run: |
          docker compose up -d
          trap 'docker compose down' EXIT

      - name: Vérifier que le service répond
        run: |
          for i in $(seq 1 12); do
            if curl -sSf http://localhost:8081 >/dev/null; then
              echo "Service web disponible"
              break
            fi
            sleep 2
          done
          curl -sSf http://localhost:8081 | grep -q "Niveau 1 validé"
          echo "La page HTML est servie correctement."

      - name: Arrêter Docker Compose
        if: always()
        run: docker compose down
