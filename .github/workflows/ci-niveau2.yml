name: CI/CD - Niveau 2 (Intermédiaire)

on:
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Vérifier la présence des fichiers requis
        run: |
          echo "Vérification des fichiers..."
          test -f index.html || (echo "Erreur: index.html manquant" && exit 1)
          test -f nginx.conf || (echo "Erreur: nginx.conf manquant" && exit 1)
          test -f Dockerfile || (echo "Erreur: Dockerfile manquant" && exit 1)
          test -f docker-compose.yml || (echo "Erreur: docker-compose.yml manquant" && exit 1)
          echo "Tous les fichiers requis sont présents !"

      - name: Build de l'image Docker
        run: docker build -t nginx-tp-niveau2 .

      - name: Démarrer le service avec Docker Compose
        run: |
          docker compose up -d

      - name: Vérifier que le service répond
        run: |
          # On récupère dynamiquement le port mappé sur le port 80 du conteneur
          # Cela évite les erreurs si on change le port dans docker-compose.yml
          PORT=$(docker compose port web 80 | cut -d: -f2)
          echo "Service détecté sur le port : $PORT"
          
          # Boucle de polling (attente active) pour laisser le temps au service de démarrer
          for i in $(seq 1 15); do
            echo "Tentative $i : vérification du service sur le port $PORT..."
            if curl -sSf http://localhost:$PORT >/dev/null; then
              echo "Service web disponible !"
              break
            fi
            sleep 2
          done
          
          # Vérification finale du contenu
          curl -sSf http://localhost:$PORT | grep -q "Niveau 1 validé"
          echo "La page HTML est servie correctement."

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          echo "--- Diagnostic : État des conteneurs ---"
          docker ps -a
          echo "--- Diagnostic : Logs du conteneur ---"
          docker compose logs web

      - name: Arrêter Docker Compose
        if: always()
        run: docker compose down