name: CI/CD - Niveau 2 (Intermédiaire)

on:
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build et Démarrage avec Docker Compose
        run: |
          # --wait attend que le conteneur soit réellement "healthy"
          docker compose up -d --wait
          sleep 2

      - name: Vérifier que le service répond
        run: |
          echo "--- Liste des conteneurs ---"
          docker compose ps
          
          echo "--- Test de syntaxe Nginx ---"
          docker compose exec web nginx -t

          echo "--- Test de connexion HTTP ---"
          # On teste l'accès via le port 8081
          for i in $(seq 1 10); do
            if curl -sSf http://localhost:8081 >/dev/null; then
              echo "Succès : Service web disponible !"
              break
            fi
            echo "Tentative $i échouée, on attend..."
            sleep 3
          done

          echo "--- Vérification du contenu ---"
          curl -sSf http://localhost:8081 | grep -q "Lozère" || (echo "Erreur : Texte 'Lozère' non trouvé" && exit 1)

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          echo "--- Diagnostic : Logs complets ---"
          docker compose logs web

      - name: Arrêter Docker Compose
        if: always()
        run: docker compose down